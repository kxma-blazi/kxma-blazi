      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.4" />
    </linearGradient>

    <!-- Card Shadow -->
    <filter id="shadow-light" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#64748b" flood-opacity="0.12" />
    </filter>

    <!-- Native System Fonts (No External Imports) -->
    <style>
      .main-title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 700; fill: #0f172a; font-size: 32px; letter-spacing: -0.5px; }
      .headline { font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, monospace; font-weight: 500; fill: #2563eb; font-size: 14px; }
      .label { font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, monospace; font-weight: 500; fill: #64748b; font-size: 12px; letter-spacing: 0.5px; }
      .value { font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, monospace; font-weight: 400; fill: #1e293b; font-size: 13px; }
      .mono { font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, monospace; }
      .ascii-art { font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, monospace; font-size: 9.5px; fill: #0284c7; font-weight: 700; line-height: 1; opacity: 0.9; }
      .badge-text { font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, monospace; font-size: 11px; font-weight: 500; fill: #334155; }
      
      @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.85); }
      }
      .pulse { animation: pulse-dot 2s infinite ease-in-out; transform-origin: center; }
      
      @keyframes float-badge {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      .float { animation: float-badge 4s infinite ease-in-out; }
    </style>
