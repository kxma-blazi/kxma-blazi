<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" width="1180" height="610" role="img" aria-label="Saharat Intavira - Full-Stack Developer &amp; AI Automation Specialist">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="light-bg" cx="15%" cy="15%" r="85%" fx="15%" fy="15%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#eef6ff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </radialGradient>

    <!-- Light Glass Panel Fill -->
    <linearGradient id="glass-light" x1="0%" y1="0%" x2="100%" y2="100%">
